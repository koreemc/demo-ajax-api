
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Makeup Store - AJAX Tutorial</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Page Header -->
    <header>
        <h1>Makeup Store</h1>
        <p>Discover your beauty essentials.</p>
    </header>


    <!-- Main Content -->
    <main>

        <h2>Our Makeup Products</h2>

        <p style="text-align:center;">
            Click a button below to retrieve product information
            from our PHP API using AJAX.
        </p>


        <!-- AJAX Buttons -->
        <div class="button-container">

            <button id="loadAllProducts">
                Load All Products
            </button>

            <button id="loadLipstick">
                Load Lipstick
            </button>

        </div>


        <!-- Product Display Container -->
        <div id="productList" class="product-container">

            <!-- Products will be displayed here using JavaScript -->

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
